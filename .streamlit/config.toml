[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
headless = true
port = 7860
enableXsrfProtection = true
maxUploadSize = 500

# Optimisation pour HF Spaces
[client.showErrorDetails]
expanderState = true

[runner]
magicEnabled = false
